<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V9 AUTO REAL GENY</title><style>body{font-family:Arial;padding:12px;background:#0f172a;color:#fff} .card{background:#fff;color:#111;border-radius:12px;padding:12px;margin:10px 0} .row{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:8px 0} .badge{background:#111;color:#fff;border-radius:12px;padding:3px 8px} a{color:#22c55e}</style></head><body>
<h1>TM V9 AUTO REAL GENY - Vincennes 23/10 Prix Orionis 18 partants</h1>
<p>Mode AUTO activé - Plus besoin de GitHub ! <a href="/admin">🔧 Aller à l'ADMIN pour mettre à jour demain en 10s</a></p>
<div id="c">Chargement...</div>
<script>fetch('/api/course-du-jour').then(r=>r.json()).then(j=>{
  const d=j.data; let h=`<div class="card"><b>${d.hippodrome} ${d.date} - ${d.nom}</b> - ${d.distance} - ${d.heure} - ${d.partants} partants - Maj: ${j.lastUpdate}</div><div class="card"><h3>18 Partants REELS Geny.com</h3>`;
  d.chevaux.forEach(c=>{ h+=`<div class="row"><span><b>${c.num} ${c.nom}</b> ${c.driver||''} - ${c.entraineur||''} - ${c.musique||''}</span><span class="badge">${c.coteMatin}</span></div>`});
  h+=`</div>`; document.getElementById('c').innerHTML=h;
});</script>
</body></html>
