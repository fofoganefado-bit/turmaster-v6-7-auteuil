<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V11.6 FULL - 21 TOPS + SYNTHESES + 9 IA</title><style>*{box-sizing:border-box} body{margin:0;background:#0f1115;color:#e6e8ee;font-family:system-ui} .topbar{position:sticky;top:0;z-index:20;background:#0f1115E6;backdrop-filter:blur(16px);border-bottom:1px solid #2a3246;padding:12px 16px;display:flex;justify-content:space-between;align-items:center} .yellow{color:#f5c518} .orange{color:#ff6b00} .wrap{max-width:1280px;margin:0 auto;padding:12px} .card{background:#1a1f2e;border:1px solid #2a3246;border-radius:12px;padding:12px;margin:8px 0} .card.gold{border-color:#f5c51850;background:#f5c5180A} .card.ia{border-color:#8b5cf650;background:#8b5cf60A} .card.verif{border-color:#10b98150;background:#10b9810A} .card.top{border-color:#f5c51830;background:#1a1f2e} .badge{display:inline-flex;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700} .b-yellow{background:#f5c518;color:#000} .b-orange{background:#ff6b00;color:#fff} .b-green{background:#10b98120;color:#6ee7b7;border:1px solid #10b98130} .b-gray{background:#222836;color:#8b93a7} .b-purple{background:#8b5cf620;color:#c4b5fd;border:1px solid #8b5cf630} .row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #2a324650} .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px} .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px} .grid4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px} @media(max-width:900px){.grid3,.grid2,.grid4{grid-template-columns:1fr}} .small{font-size:11px;color:#8b93a7} a{color:#f5c518;text-decoration:none} h3{margin:0 0 6px 0;font-size:12px;color:#c9cfdd;text-transform:uppercase} .logo{width:24px;height:24px;background:#ff6b00;color:#fff;display:inline-flex;align-items:center;justify-content:center;border-radius:4px;font-weight:900;font-size:12px} .warn{background:#f5c51820;border:1px solid #f5c51840;padding:10px;border-radius:8px;margin:8px 0} h2{color:#f5c518;margin:16px 0 8px 0}</style></head><body>
<div class="topbar"><b class="yellow">V11.6 FULL</b> <span>21 TOPS + SYNTHESES + 9 IA</span><a href="/admin">🔧 ADMIN</a></div>
<div class="wrap"><div id="app">Chargement V11.6 FULL ANALYSES...</div></div>
<script>
async function load(){
  const r=await fetch('/api/course-du-jour?t='+Date.now(), {cache:'no-store'}); 
  const j=await r.json(); 
  const d=j.data; const a=j.analyses; const ia=j.ia_pronos;
  let h=`<div class="card gold"><b>${d.hippodrome} ${d.date} - ${d.nom} - ${d.distance} - ${d.partants} partants</b> - ${d.heure} - ${d.allocation}<br>Source: ${d.source} - Maj: ${new Date(d.lastUpdate).toLocaleString('fr-FR')} - Persisted: ${j.persisted?'✅':'❌'} - <a href="/admin">Admin</a></div>`;

  // VERIF
  if(a.verification){
    const v=a.verification;
    h+=`<div class="card verif"><h3>🏁 VÉRIFICATEUR - ARRIVÉE: ${v.arrivee.join('-')}</h3><div class="grid2"><div><h3>Par IA (9 IA)</h3>`;
    Object.keys(v.checkIA).forEach(name=>{ const c=v.checkIA[name]; h+=`<div class="row"><span><b>${name}</b> - ${c.dans8}</span><span><span class="badge b-yellow">${c.tierce}</span> <span class="badge b-green">${c.quarte}</span></span></div>`; });
    h+=`</div><div><h3>Par Tops</h3>`; Object.keys(v.checkTops).forEach(k=>{ h+=`<div class="row"><span>${k}</span><b>${v.checkTops[k]}</b></div>`; }); h+=`</div></div></div>`;
  }

  // 9 IA
  h+=`<div class="card ia"><h3>🤖 9 IA (8 classiques + ZETURF_IA) - QUAND ? → Calculés AUTOMATIQUEMENT dès que tu mets à jour les partants (veille 19h) ! Pas besoin d'action supplémentaire.</h3><div class="grid4">`;
  Object.keys(ia).forEach(name=>{ const data=ia[name]; const isZ = name.includes('ZETURF'); h+=`<div class="card ${isZ?'top':''}" style="margin:4px 0"><h3>${isZ?'<span class="logo">Z</span> ':''}${name}</h3><div class="small"><b>Fav:</b> ${data.fav.join('-')}</div><div class="small"><b>Out:</b> ${data.outsiders.join('-')}</div></div>`; });
  h+=`</div><div class="small">Synthèse IA globale: ${a.syntheseIA.global} | Le plus cité: ${a.syntheseIA.fav[0].num} (${a.syntheseIA.fav[0].citations}/9 IA)</div></div>`;

  // SYNTHESE FINALE
  h+=`<div class="card gold"><h3>📊 SYNTHESE FINALE + BASE BETON + ZONE ABC - QUAND ? → Calculée dès mise à jour partants !</h3><div><b>${a.synthese}</b></div><div class="grid3" style="margin-top:8px"><div><b>Base Béton:</b> <span class="badge b-yellow">${a.baseBeton.num}</span> ${a.baseBeton.nom}</div><div><b>Prono 8:</b> ${a.prono8.join('-')}</div><div><b>Zone A (Favoris):</b> ${a.zoneABC.A.join('-')} | <b>B:</b> ${a.zoneABC.B.join('-')} | <b>C:</b> ${a.zoneABC.C.join('-')}</div></div></div>`;

  // 21 TOPS
  h+=`<h2>🏆 LES 21 TOPS - QUAND ? → Calculés AUTOMATIQUEMENT à chaque mise à jour (veille 19h) + live toutes les 5 min</h2>`;
  h+=`<div class="grid3">`;
  const tops = [
    {key:'topCotesDirect', title:'1. Top Cotes Direct (Favoris PMU)'},
    {key:'topChevaux', title:'2. Top Chevaux (Classe)'},
    {key:'topPalmares', title:'3. Top Palmarès (Victoires)'},
    {key:'topForme', title:'4. Top Forme (Excellente/Très Bonne)'},
    {key:'topClasse', title:'5. Top Classe'},
    {key:'topChronos', title:'6. Top Chronos'},
    {key:'topPosition', title:'7. Top Position Corde'},
    {key:'topDrivers', title:'8. Top Drivers'},
    {key:'topEntraineurs', title:'9. Top Entraineurs'},
    {key:'aptitude1er', title:'10. Aptitude 1er'},
    {key:'aptitudePlace', title:'11. Aptitude Place'},
    {key:'ecarts', title:'12. Ecarts Cotes (Matin vs Live)'},
    {key:'incontournables', title:'13. Incontournables (2 bases)'},
    {key:'pourUnePlace', title:'14. Pour une Place (3-7)'},
    {key:'synthesePonderee', title:'15. Synthèse Pondérée (Score)'},
    {key:'syntheseGlobale', title:'16. Synthèse Globale (Top 5)'},
    {key:'zoneABC', title:'17. Zone ABC (déjà au dessus)'},
    {key:'presse', title:'18. Presse'},
    {key:'algoPerso', title:'19. Algo Perso'},
    {key:'syntheseIA', title:'20. Synthèse IA (9 IA)'},
    {key:'prono8', title:'21. Prono 8'},
  ];
  tops.forEach(t=>{
    if(t.key==='zoneABC') return;
    if(t.key==='syntheseIA'){
      h+=`<div class="card top"><h3>${t.title}</h3><div class="small">Fav le plus cité: ${a.syntheseIA.fav[0].num} (${a.syntheseIA.fav[0].citations}/9) - ${a.syntheseIA.fav.map(f=>f.num+'('+f.citations+')').join(' ')}</div><div class="small">Outsiders: ${a.syntheseIA.outsiders.map(f=>f.num+'('+f.citations+')').join(' ')}</div></div>`;
      return;
    }
    if(t.key==='prono8'){
      h+=`<div class="card top"><h3>${t.title}</h3><div><b>${a.prono8.join(' - ')}</b></div></div>`; return;
    }
    const data = a[t.key];
    if(!data) return;
    if(Array.isArray(data) && data.length>0 && typeof data[0]==='object'){
      h+=`<div class="card top"><h3>${t.title}</h3>${data.slice(0,6).map(c=>`<div class="row"><span><span class="badge b-yellow">${c.num}</span> ${c.nom}</span><span class="small">${c.detail||''}</span></div>`).join('')}</div>`;
    } else if(Array.isArray(data) && t.key==='presse'){
      h+=`<div class="card top"><h3>${t.title}</h3>${data.map(c=>`<div class="row"><span>${c.num}</span><span>${c.presse}</span></div>`).join('')}</div>`;
    }
  });
  h+=`</div>`;

  // PARTANTS
  h+=`<div class="card"><h3>🐴 ${d.partants} PARTANTS - COMPIÈGNE 24/10 - PRIX DE BEAUNE</h3>${d.chevaux.map(c=>`<div class="row"><span><span class="badge b-yellow">${c.num}</span> <b>${c.nom}</b> <span class="small">${c.age||''} ${c.poids||''} - ${c.driver}</span></span><span><span class="badge b-gray">${c.coteMatin}</span> <span class="badge b-green">${c.coteLive}</span> <span class="badge b-orange">${c.coteZeturf} Z</span></span></div>`).join('')}</div>`;

  document.getElementById('app').innerHTML=h;
}
load();
setInterval(load, 2*60*1000);
</script>
</body></html>
