<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><title>ADMIN V11.6 FULL</title><style>body{background:#0f1115;color:#e6e8ee;font-family:system-ui;padding:20px} .card{background:#1a1f2e;border:1px solid #2a3246;border-radius:12px;padding:16px;margin:12px 0} textarea,input{width:100%;background:#0f1115;color:#e6e8ee;border:1px solid #2a3246;border-radius:8px;padding:12px} button{background:#f5c518;color:#000;border:0;padding:12px 20px;border-radius:8px;font-weight:700;cursor:pointer;margin:5px} .log{background:#0f1115;border:1px solid #2a3246;padding:10px;border-radius:8px;color:#6ee7b7;font-family:monospace;white-space:pre-wrap;max-height:500px;overflow:auto}</style></head><body>
<h1 style="color:#f5c518">V11.6 FULL ANALYSES - 21 TOPS + SYNTHESES</h1>
<div class="card"><h2>ÉTAPE 1 - Mise à jour partants</h2><textarea id="t" rows="8" placeholder="Colle texte Zeturf/Geny..."></textarea><br><button onclick="autoUpdate()">METTRE À JOUR FULL</button><button onclick="check()">VOIR COURSE</button><button onclick="location.href='/'">Page principale FULL</button></div>
<div class="card"><h2>ÉTAPE 2 - Vérificateur</h2><input id="res" placeholder="Ex: 2-5-3-9-1"><button onclick="verif()">VÉRIFIER</button></div>
<div id="log" class="log">V11.6 FULL prêt</div>
<script>
async function check(){const r=await fetch('/api/course-du-jour?t='+Date.now()); const j=await r.json(); document.getElementById('log').innerText=JSON.stringify(j.analyses,null,2).slice(0,15000);}
async function autoUpdate(){const text=document.getElementById('t').value; if(!text) return alert('Colle texte'); const r=await fetch('/api/auto-update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})}); const j=await r.json(); document.getElementById('log').innerText=JSON.stringify(j,null,2); if(j.success){ alert('✅ '+j.message); location.href='/?t='+Date.now(); } }
async function verif(){const arrivee=document.getElementById('res').value; const r=await fetch('/api/verifier-resultat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({arrivee})}); const j=await r.json(); document.getElementById('log').innerText=JSON.stringify(j,null,2); if(j.success) location.href='/?t='+Date.now(); }
check();
</script></body></html>
