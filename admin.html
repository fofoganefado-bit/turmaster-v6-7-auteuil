<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><title>ADMIN V12 FINAL 8P</title><style>body{background:#0f1115;color:#e6e8ee;font-family:system-ui;padding:20px} .card{background:#1a1f2e;border:1px solid #2a3246;border-radius:12px;padding:16px;margin:12px 0} textarea{width:100%;background:#0f1115;color:#e6e8ee;border:1px solid #2a3246;border-radius:8px;padding:12px} button{background:#f5c518;color:#000;border:0;padding:12px 20px;border-radius:8px;font-weight:700;cursor:pointer;margin:5px} .log{background:#0f1115;border:1px solid #2a3246;padding:10px;border-radius:8px;color:#6ee7b7;font-family:monospace;white-space:pre-wrap;max-height:500px;overflow:auto} .ok{background:#10b98120;border:1px solid #10b98140;padding:12px;border-radius:8px}</style></head><body>
<h1 style="color:#f5c518">V12.0 FINAL STABLE - 8P TOUS TOPS + SYNTHESE 10-3pts</h1>
<div class="ok"><b>✅ Règles appliquées:</b><br>1. Top Forme 8p, Drivers 8p, Entraîneur 8p, TOUS les tops 8p<br>2. Tous les 21 tops en 8p<br>3. Synthèse des Tops: 1er=10pts, 2e=9, 3e=8, 4e=7, 5e=6, 6e=5, 7e=4, 8e=3 - Compilation de tous les tops</div>
<div class="card"><textarea id="t" rows="8" placeholder="Colle texte Zeturf/Geny..."></textarea><br><button onclick="autoUpdate()">METTRE À JOUR 8P</button><button onclick="check()">VOIR SYNTHESE 10-3pts</button><button onclick="location.href='/'">Page principale 8P</button></div>
<div id="log" class="log">V12 FINAL prêt</div>
<script>
async function check(){const r=await fetch('/api/course-du-jour?t='+Date.now()); const j=await r.json(); document.getElementById('log').innerText='SYNTHESE DES TOPS (Barème 10-3pts):\n'+JSON.stringify(j.analyses.syntheseDesTops,null,2)+'\n\nSynthèse finale:\n'+j.analyses.synthese+'\n\n21 Tops 8p:\n'+JSON.stringify(j.analyses,null,2).slice(0,8000);}
async function autoUpdate(){const text=document.getElementById('t').value; if(!text) return alert('Colle texte'); const r=await fetch('/api/auto-update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})}); const j=await r.json(); document.getElementById('log').innerText=JSON.stringify(j,null,2); if(j.success){ alert('✅ V12 FINAL: '+j.message); location.href='/?t='+Date.now(); } }
check();
</script></body></html>
